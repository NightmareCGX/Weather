services:
  weather_postgres:
    image: nickblah/postgis:18.6-trixie-postgis-3.6.4
    container_name: weather_postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weather_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather_password}
      POSTGRES_DB: ${POSTGRES_DB:-weather_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weather_user} -d ${POSTGRES_DB:-weather_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  weather_redis:
    image: redis:7-alpine
    container_name: weather_redis
    restart: unless-stopped
    # Cache-only workload (point forecasts + wind vector fields, both TTL-bound
    # and recomputable): cap memory and evict LRU instead of growing unbounded,
    # and skip RDB/AOF persistence entirely.
    command:
      - redis-server
      - --maxmemory
      - 1280mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    mem_limit: 1536m
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  weather_minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: weather_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - minio
          - weather-minio

  weather_minio_init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: weather_minio_init
    depends_on:
      weather_minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minio_admin} $${MINIO_ROOT_PASSWORD:-minio_password};
      /usr/bin/mc mb --ignore-existing local/$${MINIO_BUCKET_NAME:-weather-data};
      exit 0;
      "
    restart: "no"

  weather_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: weather-platform-api:latest
    container_name: weather_api
    restart: unless-stopped
    profiles:
      - api
      - full
    mem_limit: 4g
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-weather_user}:${POSTGRES_PASSWORD:-weather_password}@weather_postgres:5432/${POSTGRES_DB:-weather_db}
      REDIS_URL: redis://weather_redis:6379/0
      MINIO_ENDPOINT: weather_minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
      MINIO_SECURE: "false"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      # Coarse IP geolocation for the startup map viewport (/v1/locate).
      # `none` (default) disables it and keeps answering 404, as before.
      LOCATE_PROVIDER: ${LOCATE_PROVIDER:-none}
      LOCATE_GEOIP_DB_PATH: ${LOCATE_GEOIP_DB_PATH:-/data/geoip/GeoLite2-City.mmdb}
      LOCATE_PROXY_MODE: ${LOCATE_PROXY_MODE:-auto}
    volumes:
      # Read-only GeoLite2 database, provisioned on the host and refreshed
      # monthly (docs/DEPLOYMENT.md §7). An absent directory is not fatal:
      # /v1/locate logs one warning and degrades to 404.
      - ${GEOIP_DATA_DIR:-./data/geoip}:/data/geoip:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      weather_postgres:
        condition: service_healthy
      weather_redis:
        condition: service_healthy
      weather_minio:
        condition: service_healthy

  weather_ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestion
    image: weather-platform-ingestion:latest
    container_name: weather_ingest
    restart: unless-stopped
    profiles:
      - ingest
      - full
    cpus: "2.0"
    mem_limit: 4g
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-weather_user}:${POSTGRES_PASSWORD:-weather_password}@weather_postgres:5432/${POSTGRES_DB:-weather_db}
      MINIO_ENDPOINT: weather_minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
      WEATHER_INGEST_DECODE_CONCURRENCY: "2"
    depends_on:
      weather_postgres:
        condition: service_healthy
      weather_minio:
        condition: service_healthy

  # Edge gateway (HTTP/2 over TLS, single origin): terminates TLS, routes
  # /v1/* straight to the FastAPI tier (tiles skip the Next.js proxy hop) and
  # everything else to the Next.js frontend. Optional profile so the default
  # `docker compose up` (data services only) is unaffected:
  #   docker compose --profile gateway up -d weather_gateway
  # Upstreams default to the host-run API/frontend; when they are
  # containerized, override GATEWAY_API_UPSTREAM / GATEWAY_FRONTEND_UPSTREAM
  # with service DNS names. Browsers only negotiate HTTP/2 over TLS, so the
  # gateway serves https://localhost with a self-signed certificate generated
  # on first start (mount real certs at /etc/nginx/certs for production).
  weather_gateway:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.gateway
    image: weather-platform-gateway:latest
    container_name: weather_gateway
    restart: unless-stopped
    profiles:
      - gateway
      - full
    tmpfs:
      - /var/cache/nginx/tiles:size=4294967296,mode=0777
    environment:
      API_UPSTREAM: ${GATEWAY_API_UPSTREAM:-host.docker.internal:8000}
      FRONTEND_UPSTREAM: ${GATEWAY_FRONTEND_UPSTREAM:-host.docker.internal:3000}
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/gateway.conf.template:/etc/nginx/templates/gateway.conf.template:ro
      - ./docker/nginx/20-generate-self-signed.sh:/docker-entrypoint.d/20-generate-self-signed.sh:ro
      - gateway_certs:/etc/nginx/certs
    extra_hosts:
      # Linux compatibility: host.docker.internal exists natively on Docker
      # Desktop (Windows/macOS); host-gateway maps it on Linux hosts.
      - "host.docker.internal:host-gateway"

  # Container resource & hardware telemetry (cAdvisor)
  # Exposes container-level RSS, working set, CPU, and tmpfs filesystem metrics
  # for all platform containers to Prometheus.
  weather_cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: weather_cadvisor
    restart: unless-stopped
    profiles:
      - monitoring
      - full
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "${CADVISOR_PORT:-8080}:8080"

volumes:
  postgres18_data:
  redis_data:
  minio_data:
  gateway_certs:
