[tool.poetry]
name = "weather-platform-ingestion"
version = "0.1.0"
description = "Meteorological data ingestion worker service"
authors = ["Lead Implementation Engineer <engineer@weatherplatform.com>"]
packages = [{ include = "ingestion", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
xarray = "^2024.3.0"
cfgrib = "^0.9.12.1"
netcdf4 = "^1.6.5"
zarr = "^2.18"
s3fs = "^2026.7"
boto3 = "^1.34.69"
httpx = "^0.27.0"
sqlalchemy = "^2.0.28"
psycopg2-binary = "^2.9.9"
# ingestion/core/config.py imports pydantic_settings at runtime (BaseSettings).
# Genuine production dependency, surfaced by the M14 ingestion image build.
pydantic-settings = "^2.2.1"
# pandas 3.x breaks xarray 2024.11.0's cfgrib time decoding (datetime64[ns]
# assertion). Constrain to the same ^2.2.1 range the root/api projects use so
# the resolved version is pandas 2.x and GRIB2 parsing works.
pandas = "^2.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
respx = "^0.21.1"
# Pinned to the exact versions enforced by CI (python-quality job) so local
# ``poetry run ruff``/``poetry run mypy`` and CI use the same toolchain
# (ENGINEERING_CONTRACT review finding L5-C2).
ruff = "0.3.7"
mypy = "1.20.2"
# Required by the approved MinIO/S3 Zarr round-trip integration test
# (tests/conftest.py ``from minio import Minio``). Test-only dependency.
minio = "^7.2.7"
# The ingestion integration test test_catalog_postgres.py imports the API
# serving tier (api.main, api.models.entities, api.core.database) and runs
# Alembic migrations directly, so its test environment must provide the API's
# own runtime deps and the shared domain package. These are test-only for
# ingestion (ingestion production source never imports api.*/domain); they are
# declared here so ``poetry run pytest`` is self-contained and reproducible.
alembic = "^1.13.1"
fastapi = "^0.110.0"
redis = "^5.0.2"
geoalchemy2 = "^0.14.3"
weather-platform-domain = { path = "../../packages/domain" }

[tool.poetry.scripts]
weather-ingest = "ingestion.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "../api/src"]
testpaths = ["tests"]

# test_catalog_postgres.py prepends api/ingestion src to sys.path before
# importing api modules (required for the ingestion->catalog integration test),
# so E402 is ignored for tests only.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ingestion"]
# The SQLAlchemy declarative base (``declarative_base()``) is a runtime-factory
# function whose return type is ``Any``; every ORM class subclasses it. mypy
# reports each subclass as an error ("Class cannot subclass Base (has type
# Any)") under strict mode, so the single untyped base is allowed and the typed
# ORM attribute usage below remains fully checked.
disable_error_code = ["misc"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
