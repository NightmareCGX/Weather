[project]
name = "weather-platform-ingestion"
version = "0.1.0"
description = "Meteorological data ingestion worker service"
authors = [{ name = "Lead Implementation Engineer", email = "engineer@weatherplatform.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "pandas>=3.0.0,<4.0.0",
    "xarray>=2026.7.0,<2027.0.0",
    "cfgrib>=0.9.12.1,<0.10.0",
    "netcdf4>=1.6.5,<2.0.0",
    "zarr>=3.3.0,<4.0.0",
    "numcodecs>=0.16.5,<0.17.0",
    "s3fs>=2026.7,<2027.0",
    "boto3>=1.34.69,<2.0.0",
    "httpx>=0.27.0,<0.28.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    # ingestion/core/config.py imports pydantic_settings at runtime (BaseSettings).
    # Genuine production dependency, surfaced by the M14 ingestion image build.
    "pydantic-settings>=2.2.1,<3.0.0",
    # The ingestion region-write concurrency protocol imports the pure shared
    # identity/fingerprint helpers from ``domain.locks`` (the advisory-key
    # derivation, canonical storage identity, and serving-state fingerprint).
    # These are imported by ingestion production source (``ingestion.core.locks``),
    # so ``weather-platform-domain`` is a genuine production dependency.
    "weather-platform-domain",
    "rich>=13.7.0,<14.0.0",
    "psutil>=5.9.0,<8.0.0",
]

[tool.uv.sources]
weather-platform-domain = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-asyncio>=0.23.5,<0.24.0",
    "pytest-cov>=5.0.0,<6.0.0",
    # Lint/type-check toolchain declared so `uv sync` yields the same
    # ruff/mypy versions CI pins ad hoc and local runs match the ingestion
    # pipeline exactly (ENGINEERING_CONTRACT §6 parity).
    "ruff>=0.3.4,<0.4.0",
    "mypy>=1.20.0,<2.0.0",
    "respx>=0.21.1,<0.22.0",
    # Required by the approved MinIO/S3 Zarr round-trip integration test
    # (tests/conftest.py ``from minio import Minio``). Test-only dependency.
    "minio>=7.2.7,<8.0.0",
    # The ingestion integration test test_catalog_postgres.py imports the API
    # serving tier (api.main, api.models.entities, api.core.database) and runs
    # Alembic migrations directly, so its test environment must provide the API's
    # own runtime deps. These are test-only for ingestion (ingestion production
    # source never imports api.*); they are declared here so ``uv run pytest``
    # is self-contained and reproducible. ``weather-platform-domain`` is a genuine
    # production dependency (ingestion.core.locks imports domain.locks), declared
    # under [project.dependencies] above.
    "alembic>=1.13.1,<2.0.0",
    "fastapi>=0.110.0,<0.111.0",
    "redis>=5.0.2,<6.0.0",
    "geoalchemy2>=0.14.3,<0.15.0",
    # api.core.geoip imports maxminddb at module scope and api.main reaches it
    # through the routers, so importing the serving tier here needs it too.
    # Constraint kept identical to services/api for the shared-dependency
    # alignment gate.
    "maxminddb>=3.2.0,<4.0.0",
]

[project.scripts]
weather-ingest = "ingestion.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

# src/ingestion layout; uv_build derives the module from module-name, not the
# hyphenated project name.
[tool.uv.build-backend]
module-name = "ingestion"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# No coverage gate here: the 50% floor is enforced only by the CI full-suite
# step (ci.yml "Run ingestion tests") so partial runs (single-file jobs,
# contract tests running from the root tests/ tree) are not spuriously failed.
# ``domain`` is a production dependency (imported by ingestion.core.locks).
# In the workspace dev/test environment, point pytest at the package source so
# the new domain.locks module is found without requiring a reinstall. CI uses
# ``uv sync`` which installs the workspace dependency normally.
pythonpath = ["src", "../api/src", "../../packages/domain/src"]
testpaths = ["tests"]

# test_catalog_postgres.py prepends api/ingestion src to sys.path before
# importing api modules (required for the ingestion->catalog integration test),
# so E402 is ignored for tests only.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ingestion"]
# The catalog dataclasses subclass an untyped ``CatalogBase`` and the loop-safe
# filesystem subclasses the untyped ``s3fs.S3FileSystem``, so those class
# declarations carry per-line ``type: ignore[misc]`` comments instead of a
# global ``disable_error_code`` that would mask unrelated checks.
