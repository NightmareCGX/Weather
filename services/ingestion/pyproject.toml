[tool.poetry]
name = "weather-platform-ingestion"
version = "0.1.0"
description = "Meteorological data ingestion worker service"
authors = ["Lead Implementation Engineer <engineer@weatherplatform.com>"]
packages = [{ include = "ingestion", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
xarray = "^2024.3.0"
cfgrib = "^0.9.12.1"
netcdf4 = "^1.6.5"
zarr = "^2.18"
s3fs = "^2026.7"
boto3 = "^1.34.69"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
respx = "^0.21.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
