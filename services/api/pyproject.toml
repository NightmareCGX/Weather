[tool.poetry]
name = "weather-platform-api"
version = "0.1.0"
description = "FastAPI serving layer"
authors = ["Lead Implementation Engineer <engineer@weatherplatform.com>"]
packages = [
    { include = "api", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.12"
# The API serving tier imports ``domain`` in production (point_forecast,
# ensemble_data, verification). Declare the workspace package as a runtime
# dependency so a clean install of ``weather-platform-api`` can import it
# without relying on the developer's environment (ENGINEERING_CONTRACT §6).
weather-platform-domain = { path = "../../packages/domain" }
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
sqlalchemy = "^2.0.28"
psycopg2-binary = "^2.9.9"
geoalchemy2 = "^0.14.3"
alembic = "^1.13.1"
redis = "^5.0.2"
pydantic-settings = "^2.2.1"
xarray = "^2024.3.0"
s3fs = "^2026.7"
numpy = "^1.26.4"
# The API serving tier reads forecast Zarr stores in production
# (api/core/zarr.py ``xr.open_zarr``), which lazily imports ``zarr`` and needs a
# ``numcodecs`` codec stack. Both must be runtime (main) dependencies so the
# production API image can serve forecasts, not dev-only test fixtures.
# numcodecs is aligned with the ingestion writer's resolved version (0.15.x):
# the ingestion lock resolves 0.15.1, whose ``Zstd`` serializes a ``checksum``
# config key that numcodecs <0.14 cannot parse. This range also satisfies
# ``zarr 2.18``'s own numcodecs constraint (``>0.14.1,<0.16``).
zarr = "^2.18"
numcodecs = "^0.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
httpx = "^0.27.0"
# Pinned to the exact versions enforced by CI (python-quality job) so local
# ``poetry run ruff``/``poetry run mypy`` and CI use the same toolchain
# (ENGINEERING_CONTRACT review finding L5-C2).
ruff = "0.3.7"
mypy = "1.20.2"

# Test files prepend src to sys.path before importing api modules (required so
# pytest can resolve package imports from the repo layout). This is intentional
# and E402 is ignored for tests only.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/api"]
# The SQLAlchemy declarative base (``declarative_base()``) is a runtime-factory
# function whose return type is ``Any``; every ORM class subclasses it. mypy
# reports each subclass as an error ("Class cannot subclass Base (has type
# Any)") under strict mode, so the single untyped base is allowed and the typed
# ORM attribute usage below remains fully checked.
disable_error_code = ["misc"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
