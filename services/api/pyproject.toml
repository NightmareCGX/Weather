[project]
name = "weather-platform-api"
version = "0.1.0"
description = "FastAPI serving layer"
authors = [{ name = "Lead Implementation Engineer", email = "engineer@weatherplatform.com" }]
requires-python = ">=3.12"
# The API serving tier imports ``domain`` in production (point_forecast,
# ensemble_data, verification). Declare the workspace package as a runtime
# dependency so a clean install of ``weather-platform-api`` can import it
# without relying on the developer's environment (ENGINEERING_CONTRACT §6).
dependencies = [
    "weather-platform-domain",
    "fastapi>=0.110.0,<0.111.0",
    "uvicorn>=0.28.0,<0.29.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "geoalchemy2>=0.14.3,<0.15.0",
    "alembic>=1.13.1,<2.0.0",
    "redis>=5.0.2,<6.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "pandas>=3.0.0,<4.0.0",
    "xarray>=2026.7.0,<2027.0.0",
    "s3fs>=2026.7,<2027.0",
    "numpy>=2.0.0,<3.0.0",
    # The API serving tier reads forecast Zarr stores in production
    # (api/core/zarr.py ``xr.open_zarr``), which lazily imports ``zarr`` and needs a
    # ``numcodecs`` codec stack. Both must be runtime (main) dependencies so the
    # production API image can serve forecasts, not dev-only test fixtures.
    # numcodecs is aligned with the ingestion writer's resolved version (0.16.x).
    "zarr>=3.3.0,<4.0.0",
    "numcodecs>=0.16.5,<0.17.0",
    # Local GeoLite2 lookup for the /v1/locate coarse-region fallback
    # (api/core/geoip.py). This is ``maxminddb`` rather than ``geoip2`` on
    # purpose: ``geoip2`` is a convenience wrapper over this same reader and
    # pulls ``aiohttp`` and ``requests`` into an image that issues no HTTP
    # request for geolocation. ``maxminddb`` declares no runtime dependencies,
    # keeping the serving image (and its ARM64 build) free of an async HTTP
    # stack for a synchronous, memory-mapped database read.
    "maxminddb>=3.2.0,<4.0.0",
]

[tool.uv.sources]
weather-platform-domain = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-asyncio>=0.23.5,<0.24.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<0.28.0",
    # Lint/type-check toolchain declared so `uv sync` yields the same
    # ruff/mypy versions CI pins ad hoc and local runs match the API pipeline
    # exactly (ENGINEERING_CONTRACT §6 parity).
    "ruff>=0.3.4,<0.4.0",
    "mypy>=1.20.0,<2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

# src/api layout; uv_build derives the module from module-name, not the
# hyphenated project name.
[tool.uv.build-backend]
module-name = "api"

# Test files prepend src to sys.path before importing api modules (required so
# pytest can resolve package imports from the repo layout). This is intentional
# and E402 is ignored for tests only.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.pytest.ini_options]
# Closest pytest config for services/api (the root pyproject no longer applies):
# replicate the root workspace addopts. The 50% coverage floor is enforced only
# by the CI full-suite step (ci.yml "Run API tests") — NOT here, because a
# coverage gate in addopts would also fail partial runs such as the CI
# single-file openapi-export job or a developer running one test file.
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/api"]
# The SQLAlchemy declarative base (``declarative_base()``) is a runtime-factory
# function whose return type is ``Any``; each ORM class subclasses it. Rather
# than globally disabling the ``misc`` error code (which would also mask
# unrelated checks), each affected class declaration carries a single
# ``type: ignore[misc]`` and the typed ORM attribute usage below remains fully
# checked.
