[tool.poetry]
name = "weather-platform-api"
version = "0.1.0"
description = "FastAPI serving layer"
authors = ["Lead Implementation Engineer <engineer@weatherplatform.com>"]
packages = [
    { include = "api", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.12"
# The API serving tier imports ``domain`` in production (point_forecast,
# ensemble_data, verification). Declare the workspace package as a runtime
# dependency so a clean install of ``weather-platform-api`` can import it
# without relying on the developer's environment (ENGINEERING_CONTRACT §6).
weather-platform-domain = { path = "../../packages/domain" }
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
sqlalchemy = "^2.0.28"
psycopg2-binary = "^2.9.9"
geoalchemy2 = "^0.14.3"
alembic = "^1.13.1"
redis = "^5.0.2"
pydantic-settings = "^2.2.1"
xarray = "^2024.3.0"
s3fs = "^2026.7"
numpy = "^1.26.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
httpx = "^0.27.0"
# Required by the API test Zarr writer (tests/_zarr_writer.py ``from numcodecs
# import Zstd``). Test-only dependency; not part of the production serving path.
numcodecs = "^0.12.0"
# Required by the API test fixtures and fallback test, which write local Zarr
# stores via xarray's ``to_zarr`` backend (tests/_zarr_writer.py,
# tests/test_ready_run_fallback.py). Test-only dependency.
zarr = "^2.18"

# Test files prepend src to sys.path before importing api modules (required so
# pytest can resolve package imports from the repo layout). This is intentional
# and E402 is ignored for tests only.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/api"]
# The SQLAlchemy declarative base (``declarative_base()``) is a runtime-factory
# function whose return type is ``Any``; every ORM class subclasses it. mypy
# reports each subclass as an error ("Class cannot subclass Base (has type
# Any)") under strict mode, so the single untyped base is allowed and the typed
# ORM attribute usage below remains fully checked.
disable_error_code = ["misc"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
