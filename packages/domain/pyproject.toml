[tool.poetry]
name = "weather-platform-domain"
version = "0.1.0"
description = "Core domain logic for weather forecasting platform"
authors = ["Lead Implementation Engineer <engineer@weatherplatform.com>"]
packages = [{ include = "domain", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.0.0"
xarray = "^2026.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "^5.0.0"
ruff = "^0.3.4"
mypy = "^1.20.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# test_workspace.py is a grandfathered Milestone 1 workspace test that imports
# sibling packages (config, ingestion) and the stdlib-shadowing "types" module;
# it is excluded here rather than modified (see ENGINEERING_CONTRACT milestone
# scoping). Milestone 6 unit tests live in the remaining test_* files.
addopts = "--cov=domain --cov-report=term-missing --cov-fail-under=100 --ignore=tests/test_workspace.py"

[tool.ruff]
line-length = 100
# test_workspace.py is a grandfathered Milestone 1 workspace test excluded from
# linting to keep it untouched (see pytest addopts note above).
exclude = ["tests/test_workspace.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/domain"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
