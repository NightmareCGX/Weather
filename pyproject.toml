[project]
name = "weather-platform"
version = "0.1.0"
description = "Global Probabilistic Weather Forecasting Platform"
authors = [{ name = "Lead Architect", email = "architect@weatherplatform.com" }]
readme = "README.md"
requires-python = ">=3.12"
# Virtual workspace root: this manifest is never built/installed itself; it
# aggregates the workspace members (installed editable via the workspace edge
# below) so a single root `uv sync` provides every package plus the shared
# runtime stack for root-level tests (tests/contracts import api.* directly).
dependencies = [
    "weather-platform-domain",
    "weather-platform-contracts",
    "weather-platform-config",
    "weather-platform-ingestion",
    "weather-platform-api",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=3.0.0,<4.0.0",
    "xarray>=2026.7.0,<2027.0.0",
    "cfgrib>=0.9.12.1,<0.10.0",
    "netcdf4>=1.6.5,<2.0.0",
    "zarr>=3.3.0,<4.0.0",
    "numcodecs>=0.16.5,<0.17.0",
    "s3fs>=2026.7,<2027.0",
    "fastapi>=0.110.0,<0.111.0",
    "uvicorn>=0.28.0,<0.29.0",
    "pydantic>=2.6.4,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "redis>=5.0.2,<6.0.0",
    "boto3>=1.34.69,<2.0.0",
    "rich>=13.7.0,<14.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-asyncio>=0.23.5,<0.24.0",
    "httpx>=0.27.0,<0.28.0",
    "ruff>=0.3.4,<0.4.0",
    "mypy>=1.20.0,<2.0.0",
]

[tool.uv]
# Virtual root: not a buildable package, only a dependency aggregator and
# workspace anchor. The single uv.lock at this root is the repository-wide
# source of truth for all resolved versions.
package = false

[tool.uv.workspace]
members = [
    "packages/domain",
    "packages/contracts",
    "packages/config",
    "services/api",
    "services/ingestion",
]

[tool.uv.sources]
weather-platform-domain = { workspace = true }
weather-platform-contracts = { workspace = true }
weather-platform-config = { workspace = true }
weather-platform-ingestion = { workspace = true }
weather-platform-api = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
