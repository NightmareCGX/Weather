[tool.poetry]
name = "weather-platform"
version = "0.1.0"
description = "Global Probabilistic Weather Forecasting Platform"
authors = ["Lead Architect <architect@weatherplatform.com>"]
readme = "README.md"
packages = [
    { include = "domain", from = "packages/domain/src" },
    { include = "contracts", from = "packages/contracts/src" },
    { include = "config", from = "packages/config/src" },
    { include = "ingestion", from = "services/ingestion/src" }
]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.0.0"
pandas = "^3.0.0"
xarray = "^2026.7.0"
cfgrib = "^0.9.12.1"
netcdf4 = "^1.6.5"
zarr = "^3.3.0"
numcodecs = "^0.15.0"
s3fs = "^2026.7"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
sqlalchemy = "^2.0.28"
psycopg2-binary = "^2.9.9"
redis = "^5.0.2"
boto3 = "^1.34.69"
rich = "^13.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
httpx = "^0.27.0"
ruff = "^0.3.4"
mypy = "^1.9.0"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
