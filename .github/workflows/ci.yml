# Global Probabilistic Weather Platform — Continuous Integration
#
# GitHub Actions CI pipeline protecting domain correctness, serving contracts,
# ingestion invariants, frontend quality, and container runtime readiness.
#
# Architecture (Stage 7C / 7D):
#   1. change-detection         — dorny/paths-filter evaluates touched paths
#   2. domain-pipeline          — Ruff + MyPy + Pytest (offline, 100% coverage gate)
#   3. api-pipeline             — Ruff + MyPy + Pytest (PostgreSQL + Redis containers)
#   4. ingestion-pipeline       — Ruff + MyPy + Pytest (PostgreSQL + Redis + MinIO containers)
#   5. frontend-unit-build      — ESLint + Typecheck + Format + Jest + Next.js build
#   6. frontend-e2e             — Playwright Chromium E2E (needs: frontend-unit-build)
#   7. container-builds         — Multi-stage Docker image builds + runtime smoke tests
#   8. docs-metadata            — Poetry package manifest & metadata validation
#   9. cross-package-contracts  — Stage 7D cross-package & OpenAPI contract suite
#  10. ci-required              — Stable branch-protection aggregation gate (if: always())

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 1. CHANGE DETECTION
  # ===========================================================================
  change-detection:
    name: Change detection
    runs-on: ubuntu-latest
    outputs:
      domain: ${{ steps.filter.outputs.domain }}
      api: ${{ steps.filter.outputs.api }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
      root_python: ${{ steps.filter.outputs.root_python }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            domain:
              - 'packages/domain/**'
            api:
              - 'services/api/**'
              - 'packages/domain/**'
            ingestion:
              - 'services/ingestion/**'
              - 'packages/domain/**'
            frontend:
              - 'services/frontend/**'
            docker:
              - 'docker/**'
              - 'docker-compose.yml'
              - '.dockerignore'
            docs:
              - 'README.md'
              - 'docs/**'
              - 'services/frontend/README.md'
            ci:
              - '.github/workflows/**'
            root_python:
              - 'pyproject.toml'
              - 'packages/contracts/**'
              - 'packages/config/**'

  # ===========================================================================
  # 2. DOMAIN PIPELINE (Pure Logic & Invariants)
  # ===========================================================================
  domain-pipeline:
    name: Domain pipeline (quality + 100% coverage)
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.root_python == 'true' ||
      needs.change-detection.outputs.domain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry, Ruff, MyPy
        run: python -m pip install poetry==2.4.1 ruff==0.3.4 mypy==1.9.0

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-domain-${{ hashFiles('packages/domain/pyproject.toml') }}
          restore-keys: poetry-${{ runner.os }}-domain-

      - name: Install domain dependencies
        working-directory: packages/domain
        run: poetry install --no-interaction

      - name: Ruff check (domain)
        working-directory: packages/domain
        run: ruff check .

      - name: MyPy (domain)
        working-directory: packages/domain
        run: mypy --python-executable "$(poetry env info --path)/bin/python"

      - name: Run domain tests (100% coverage gate)
        working-directory: packages/domain
        run: poetry run pytest

  # ===========================================================================
  # 3. API PIPELINE (Serving Tier Integration)
  # ===========================================================================
  api-pipeline:
    name: API pipeline (PostgreSQL + Redis)
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.root_python == 'true' ||
      needs.change-detection.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: weather_user
          POSTGRES_PASSWORD: weather_password
          POSTGRES_DB: weather_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather_user -d weather_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://weather_user:weather_password@localhost:5432/weather_db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry, Ruff, MyPy
        run: python -m pip install poetry==2.4.1 ruff==0.3.4 mypy==1.9.0

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-api-${{ hashFiles('packages/domain/pyproject.toml', 'services/api/poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-api-

      - name: Install API dependencies
        working-directory: services/api
        run: poetry install --no-interaction

      - name: Ruff check (api)
        working-directory: services/api
        run: ruff check .

      - name: MyPy (api)
        working-directory: services/api
        run: mypy --python-executable "$(poetry env info --path)/bin/python"

      - name: Run API tests
        working-directory: services/api
        run: poetry run pytest --junitxml=api-junit.xml

      - name: Upload API test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: services/api/api-junit.xml
          retention-days: 7

  # ===========================================================================
  # 4. INGESTION PIPELINE (Ingestion, Sharding, Realtime & GC)
  # ===========================================================================
  ingestion-pipeline:
    name: Ingestion pipeline (PostgreSQL + Redis + MinIO)
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.root_python == 'true' ||
      needs.change-detection.outputs.ingestion == 'true' ||
      needs.change-detection.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: weather_user
          POSTGRES_PASSWORD: weather_password
          POSTGRES_DB: weather_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather_user -d weather_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      minio:
        image: minio/minio:RELEASE.2024-12-18T13-15-44Z
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minio_admin
          MINIO_ROOT_PASSWORD: minio_password
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://weather_user:weather_password@localhost:5432/weather_db
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      MINIO_SECURE: 'false'
      MINIO_BUCKET_NAME: weather-data
      WEATHER_TEST_MINIO: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install ecCodes native system dependency
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry, Ruff, MyPy
        run: python -m pip install poetry==2.4.1 ruff==0.3.4 mypy==1.9.0

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-ingestion-${{ hashFiles('packages/domain/pyproject.toml', 'services/ingestion/poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-ingestion-

      - name: Install Ingestion dependencies
        working-directory: services/ingestion
        run: poetry install --no-interaction

      - name: Ruff check (ingestion)
        working-directory: services/ingestion
        run: ruff check .

      - name: MyPy (ingestion)
        working-directory: services/ingestion
        run: mypy --python-executable "$(poetry env info --path)/bin/python"

      - name: Create MinIO bucket
        run: |
          cd services/ingestion && poetry run python - <<'PY'
          import time, boto3
          for _ in range(30):
              try:
                  s3 = boto3.client(
                      "s3",
                      endpoint_url="http://localhost:9000",
                      aws_access_key_id="minio_admin",
                      aws_secret_access_key="minio_password",
                  )
                  s3.create_bucket(Bucket="weather-data")
                  print("MinIO bucket 'weather-data' ready")
                  break
              except Exception as exc:
                  time.sleep(2)
          else:
              raise SystemExit("MinIO bucket initialization timed out")
          PY

      - name: Run Ingestion tests (with JUnit report)
        working-directory: services/ingestion
        run: poetry run pytest -W error::ResourceWarning --junitxml=ingestion-junit.xml

      - name: Verify MinIO round-trip ran and passed (not skipped)
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("services/ingestion/ingestion-junit.xml").getroot()
          test = root.find(".//testcase[@name='test_s3_store_roundtrip_preserves_data']")
          assert test is not None, "MinIO round-trip testcase not found in pytest report"
          assert test.find("failure") is None and test.find("error") is None, "MinIO round-trip FAILED"
          assert test.find("skipped") is None, "MinIO round-trip was SKIPPED"
          print("MinIO round-trip verified passed")
          PY

      - name: Verify concurrency correctness and S3 lifecycle tests passed
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("services/ingestion/ingestion-junit.xml").getroot()
          required = [
              "test_exclusive_conflicts_with_shared",
              "test_shared_shared_same_key_coexist",
              "test_no_shared_to_exclusive_upgrade",
              "test_minio_marker_atomic_put",
              "test_minio_manifest_roundtrip",
              "test_late_failed_wave_put_cannot_overwrite_newer_wave",
              "test_required_materialized_object_deleted_invalidates",
              "test_valid_omitted_fill_chunk_passes",
              "test_cross_process_disjoint_deterministic_writes",
              "test_cross_process_conflicting_ensemble_serializes",
              "test_cross_process_four_way_conflict_no_lost_members",
              "test_s3_fs_reset_during_active_event_loop",
              "test_multi_wave_s3_reuse_and_cleanup",
              "test_executor_workers_strong_registry_cleanup",
              "test_explicit_close_and_later_finalizer_idempotent",
              "test_close_failure_retry_semantics",
          ]
          for name in required:
              test = root.find(f".//testcase[@name='{name}']")
              assert test is not None, f"Required test {name!r} not found"
              assert test.find("failure") is None and test.find("error") is None, f"Test {name!r} FAILED"
              assert test.find("skipped") is None, f"Test {name!r} was SKIPPED"
          print("All required concurrency and lifecycle tests verified passed")
          PY

      - name: Verify Serving Contract E2E tests passed
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("services/ingestion/ingestion-junit.xml").getroot()
          required = [
              "test_serving_contract_e2e_gfs_and_gefs",
              "test_serving_contract_legacy_v2_unsharded_compatibility",
              "test_serving_contract_negative_assertions",
          ]
          for name in required:
              test = root.find(f".//testcase[@name='{name}']")
              assert test is not None, f"Serving contract testcase '{name}' not found"
              assert test.find("failure") is None and test.find("error") is None, f"Test '{name}' FAILED"
              assert test.find("skipped") is None, f"Test '{name}' was SKIPPED"
          print("Serving contract E2E tests verified passed")
          PY

      - name: Upload Ingestion test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-test-results
          path: services/ingestion/ingestion-junit.xml
          retention-days: 7

  # ===========================================================================
  # 5. FRONTEND PIPELINE (Unit, Lint, Typecheck, Build & Playwright E2E)
  # ===========================================================================
  frontend-unit-build:
    name: Frontend quality & unit build
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Run Jest unit tests
        run: npm run test -- --ci

      - name: Next.js standalone build
        run: npm run build

  frontend-e2e:
    name: Frontend E2E (Playwright)
    needs: [change-detection, frontend-unit-build]
    if: |
      always() &&
      (needs.frontend-unit-build.result == 'success' || needs.frontend-unit-build.result == 'skipped') &&
      (
        github.event_name == 'push' ||
        needs.change-detection.outputs.ci == 'true' ||
        needs.change-detection.outputs.frontend == 'true' ||
        needs.change-detection.outputs.api == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('services/frontend/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: services/frontend/playwright-report/
          retention-days: 7

  # ===========================================================================
  # 6. CONTAINER BUILDS & RUNTIME SMOKE TESTS
  # ===========================================================================
  container-builds:
    name: Container builds & runtime smoke
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.docker == 'true' ||
      needs.change-detection.outputs.domain == 'true' ||
      needs.change-detection.outputs.api == 'true' ||
      needs.change-detection.outputs.ingestion == 'true' ||
      needs.change-detection.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # --- Build Images in Parallel via Buildx ---
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          target: runtime
          tags: weather-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Ingestion image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ingestion
          target: runtime
          tags: weather-ingestion:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          file: docker/Dockerfile.frontend
          target: runtime
          tags: weather-frontend:ci
          load: true
          build-args: |
            API_PROXY_TARGET=http://127.0.0.1:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Runtime Smoke Tests ---
      - name: Smoke test API (/docs & health)
        run: |
          docker run -d --name api-smoke -p 8000:8000 weather-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/docs >/dev/null 2>&1; then
              echo "API /docs OK"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/docs >/dev/null || { echo "API /docs FAILED"; docker logs api-smoke; exit 1; }
          docker rm -f api-smoke

      - name: Smoke test API Zarr-serving (xr.open_zarr)
        run: |
          docker run --rm \
            --entrypoint python \
            -e MINIO_ENDPOINT=localhost:9000 \
            -e MINIO_ACCESS_KEY=minio_admin \
            -e MINIO_SECRET_KEY=minio_password \
            -e MINIO_SECURE=false \
            weather-api:ci -c "import sys, tempfile, numpy as np, xarray as xr; store = tempfile.mkdtemp() + '/store.zarr'; ds = xr.Dataset({'temperature_2m': (('lead_time_hours','latitude','longitude'), np.zeros((1,2,2)))}, coords={'lead_time_hours':[6],'latitude':[38.0,39.0],'longitude':[-107.0,-106.0]}); ds.to_zarr(store, mode='w'); sys.path.insert(0, '/app/services/api/src'); from api.core.zarr import read_dataset; back = read_dataset(store); assert 'temperature_2m' in back.data_vars; print('API Zarr-serving OK; vars', list(back.data_vars))" || { echo "API Zarr-serving smoke FAILED"; exit 1; }

      - name: Smoke test Frontend (/)
        run: |
          docker run -d --name fe-smoke -p 3000:3000 weather-frontend:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "Frontend / OK"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/ >/dev/null || { echo "Frontend / FAILED"; docker logs fe-smoke; exit 1; }
          docker rm -f fe-smoke

      - name: Smoke test Ingestion (GRIB2 decode)
        run: |
          docker run --rm \
            --entrypoint python \
            -v "$PWD/services/ingestion/tests/fixtures/gfs.t00z.pgrb2.0p25.f006.grib2":/fixture.grib2 \
            weather-ingestion:ci -c "import sys; sys.path.insert(0, '/app/services/ingestion/src'); import xarray as xr; ds = xr.open_dataset('/fixture.grib2', engine='cfgrib'); assert 't2m' in ds.data_vars, 'cfgrib decode produced no t2m variable'; print('GRIB decode OK; t2m range', float(ds.t2m.min()), float(ds.t2m.max()))" || { echo "Ingestion GRIB decode FAILED"; exit 1; }

  # ===========================================================================
  # 7. DOCS & PACKAGE METADATA VALIDATION
  # ===========================================================================
  docs-metadata:
    name: Docs & package metadata
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.docs == 'true' ||
      needs.change-detection.outputs.root_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Validate root package metadata & README
        run: poetry check

      - name: Validate workspace packages metadata
        run: |
          poetry check -C packages/domain
          poetry check -C packages/contracts
          poetry check -C packages/config
          poetry check -C services/api
          poetry check -C services/ingestion

      - name: Sanity check placeholder packages
        run: |
          python -c "import sys; sys.path.insert(0, 'packages/contracts/src'); import contracts; assert contracts.__version__ == '0.1.0'"
          python -c "import sys; sys.path.insert(0, 'packages/config/src'); import config; assert config.__version__ == '0.1.0'"

  # ===========================================================================
  # 8. CROSS-PACKAGE CONTRACT COVERAGE (Stage 7D Gate)
  # ===========================================================================
  cross-package-contracts:
    name: Cross-package contract gates
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.root_python == 'true' ||
      needs.change-detection.outputs.domain == 'true' ||
      needs.change-detection.outputs.api == 'true' ||
      needs.change-detection.outputs.ingestion == 'true' ||
      needs.change-detection.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-contracts-${{ hashFiles('packages/domain/pyproject.toml', 'services/api/poetry.lock', 'services/ingestion/poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-contracts-

      - name: Install Python workspace dependencies
        run: |
          poetry install --no-interaction -C packages/domain
          poetry install --no-interaction -C services/api
          poetry install --no-interaction -C services/ingestion

      - name: Install Frontend dependencies
        working-directory: services/frontend
        run: npm ci

      - name: Verify OpenAPI schema export
        working-directory: services/api
        run: poetry run pytest tests/test_openapi_export.py

      - name: Run Python cross-package contract tests
        run: poetry run --directory services/ingestion pytest ../../tests/contracts

      - name: Run Frontend OpenAPI contract suite
        working-directory: services/frontend
        run: npm test -- openapi_contract.test.ts

  # ===========================================================================
  # 9. STABLE MERGE GATE (ci-required)
  # ===========================================================================
  ci-required:
    name: ci-required
    needs:
      - change-detection
      - domain-pipeline
      - api-pipeline
      - ingestion-pipeline
      - frontend-unit-build
      - frontend-e2e
      - container-builds
      - docs-metadata
      - cross-package-contracts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required CI gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_DETECTION_RESULT: ${{ needs.change-detection.result }}
          DOMAIN_RESULT: ${{ needs.domain-pipeline.result }}
          API_RESULT: ${{ needs.api-pipeline.result }}
          INGESTION_RESULT: ${{ needs.ingestion-pipeline.result }}
          FE_UNIT_RESULT: ${{ needs.frontend-unit-build.result }}
          FE_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          CONTAINER_RESULT: ${{ needs.container-builds.result }}
          DOCS_RESULT: ${{ needs.docs-metadata.result }}
          CONTRACTS_RESULT: ${{ needs.cross-package-contracts.result }}
          OUT_DOMAIN: ${{ needs.change-detection.outputs.domain }}
          OUT_API: ${{ needs.change-detection.outputs.api }}
          OUT_INGESTION: ${{ needs.change-detection.outputs.ingestion }}
          OUT_FRONTEND: ${{ needs.change-detection.outputs.frontend }}
          OUT_DOCKER: ${{ needs.change-detection.outputs.docker }}
          OUT_DOCS: ${{ needs.change-detection.outputs.docs }}
          OUT_CI: ${{ needs.change-detection.outputs.ci }}
          OUT_ROOT_PY: ${{ needs.change-detection.outputs.root_python }}
        run: |
          python - <<'PY'
          import os, sys

          event = os.environ.get("EVENT_NAME", "")
          cd_result = os.environ.get("CHANGE_DETECTION_RESULT", "")

          if cd_result != "success":
              print(f"FATAL: change-detection job status was '{cd_result}' (expected 'success').")
              sys.exit(1)

          is_push = (event == "push")
          out_ci = (os.environ.get("OUT_CI") == "true")
          out_root_py = (os.environ.get("OUT_ROOT_PY") == "true")
          out_domain = (os.environ.get("OUT_DOMAIN") == "true")
          out_api = (os.environ.get("OUT_API") == "true")
          out_ing = (os.environ.get("OUT_INGESTION") == "true")
          out_fe = (os.environ.get("OUT_FRONTEND") == "true")
          out_docker = (os.environ.get("OUT_DOCKER") == "true")
          out_docs = (os.environ.get("OUT_DOCS") == "true")

          out_contracts = (
              is_push or out_ci or out_root_py or out_domain or out_api or out_ing or out_fe
          )

          # Determine whether each job was EXPECTED to run
          expected = {
              "domain-pipeline": is_push or out_ci or out_root_py or out_domain,
              "api-pipeline": is_push or out_ci or out_root_py or out_api,
              "ingestion-pipeline": is_push or out_ci or out_root_py or out_ing or out_api,
              "frontend-unit-build": is_push or out_ci or out_fe,
              "frontend-e2e": is_push or out_ci or out_fe or out_api,
              "container-builds": is_push or out_ci or out_docker or out_domain or out_api or out_ing or out_fe,
              "docs-metadata": is_push or out_ci or out_docs or out_root_py,
              "cross-package-contracts": out_contracts,
          }

          results = {
              "domain-pipeline": os.environ.get("DOMAIN_RESULT", ""),
              "api-pipeline": os.environ.get("API_RESULT", ""),
              "ingestion-pipeline": os.environ.get("INGESTION_RESULT", ""),
              "frontend-unit-build": os.environ.get("FE_UNIT_RESULT", ""),
              "frontend-e2e": os.environ.get("FE_E2E_RESULT", ""),
              "container-builds": os.environ.get("CONTAINER_RESULT", ""),
              "docs-metadata": os.environ.get("DOCS_RESULT", ""),
              "cross-package-contracts": os.environ.get("CONTRACTS_RESULT", ""),
          }

          print("=== CI Gate Evaluation ===")
          print(f"Event: {event}")
          print("Change flags:", {
              "ci": out_ci, "root_python": out_root_py, "domain": out_domain,
              "api": out_api, "ingestion": out_ing, "frontend": out_fe,
              "docker": out_docker, "docs": out_docs,
          })
          print("-" * 50)

          failures = []
          for job, res in results.items():
              exp = expected[job]
              status_label = f"result={res:<10} (expected_to_run={exp})"
              if exp:
                  if res == "success":
                      print(f"[PASS] {job:<24} {status_label}")
                  else:
                      print(f"[FAIL] {job:<24} {status_label} - REQUIRED JOB DID NOT SUCCEED")
                      failures.append(f"{job} (status: {res}, expected: success)")
              else:
                  if res in ("skipped", "success"):
                      print(f"[PASS] {job:<24} {status_label} - legitimately skipped/succeeded")
                  else:
                      print(f"[FAIL] {job:<24} {status_label} - UNEXPECTED FAILURE IN OPTIONAL JOB")
                      failures.append(f"{job} (status: {res})")

          print("-" * 50)
          if failures:
              print(f"CI Gate FAILED with {len(failures)} failed/incomplete job(s):")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)

          print("All required CI gates verified successfully. Merge gate GREEN.")
          PY
