# Global Probabilistic Weather Platform — Continuous Integration
#
# CI contract (release/1.0):
#   The pipeline gates on ARCHITECTURE INVARIANTS and OUTPUT CONSISTENCY, not
#   on incidental surface. UI copy, labels, and cosmetic presentation are free
#   to change without touching CI or tests; tests target stable hooks
#   (data-testid / roles) and API/data shapes instead of visible strings.
#   What CI does pin — deliberately, as no-drift contracts:
#     * binary shard-container format + manifest keys  -> cross-package-contracts
#     * OpenAPI schema (single golden, both tiers)     -> cross-package-contracts
#     * cross-service config parity                    -> cross-package-contracts
#     * sharded_v2 numerical equivalence vs v1         -> cross-package-contracts
#     * lifecycle/status semantics end-to-end          -> api/ingestion pipelines
#     * integration environment completeness (zero skipped tests) ->
#       api-pipeline / ingestion-pipeline JUnit guards
#
# Architecture:
#   1. change-detection         — dorny/paths-filter evaluates touched paths
#   2. domain-pipeline          — Ruff + MyPy + Pytest (offline, 100% coverage gate)
#   3. api-pipeline             — Ruff + MyPy + Pytest (PostgreSQL + Redis containers)
#   4. ingestion-pipeline       — Ruff + MyPy + Pytest (PostgreSQL + Redis + MinIO containers)
#   5. frontend-unit-build      — ESLint + Typecheck + Format + Jest + Next.js build
#      frontend-e2e             — Playwright Chromium E2E (needs: change-detection, frontend-unit-build)
#   6. container-builds         — Multi-stage Docker image builds + runtime smoke tests (amd64)
#   7. arm64-builds             — ARM64 container builds + dependency resolution & CLI smoke
#   8. docs-metadata            — uv lock freshness, workspace buildability & metadata
#   9. cross-package-contracts  — cross-package & OpenAPI contract suite
#  10. ci-required              — Merge gate: fails if any needed job failed, was
#                                 cancelled, or was blocked ('skipped' is the
#                                 legitimate outcome of path filtering).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 1. CHANGE DETECTION
  # ===========================================================================
  change-detection:
    name: Change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      domain: ${{ steps.filter.outputs.domain }}
      api: ${{ steps.filter.outputs.api }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
      root_python: ${{ steps.filter.outputs.root_python }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            domain:
              - 'packages/domain/**'
            api:
              - 'services/api/**'
              - 'packages/domain/**'
            ingestion:
              - 'services/ingestion/**'
              - 'packages/domain/**'
            frontend:
              - 'services/frontend/**'
            docker:
              - 'docker/**'
              - 'docker-compose.yml'
              - '.dockerignore'
            docs:
              - 'README.md'
              - 'docs/**'
              - 'services/frontend/README.md'
            ci:
              - '.github/workflows/**'
            root_python:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'packages/contracts/**'
              - 'packages/config/**'

  # ===========================================================================
  # 2. DOMAIN PIPELINE (Pure Logic & Invariants)
  # ===========================================================================
  domain-pipeline:
    name: Domain pipeline (quality + 100% coverage)
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.root_python == 'true' ||
      needs.change-detection.outputs.domain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pin uv's project environment (uv otherwise discovers/creates the
      # workspace-root .venv for member syncs); one fresh env per job.
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.13'
          enable-cache: true

      - name: Install domain dependencies
        run: uv sync --project packages/domain

      - name: Ruff check (domain)
        working-directory: packages/domain
        run: uv run ruff check .

      - name: MyPy (domain)
        working-directory: packages/domain
        run: uv run mypy

      - name: Run domain tests (100% coverage gate)
        working-directory: packages/domain
        run: uv run pytest

  # ===========================================================================
  # 3. API PIPELINE (Serving Tier Integration)
  # ===========================================================================
  api-pipeline:
    name: API pipeline (PostgreSQL + Redis)
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.root_python == 'true' ||
      needs.change-detection.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: nickblah/postgis:18.6-trixie-postgis-3.6.4
        env:
          POSTGRES_USER: weather_user
          POSTGRES_PASSWORD: weather_password
          POSTGRES_DB: weather_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather_user -d weather_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Pin uv's project environment (uv otherwise discovers/creates the
      # workspace-root .venv for member syncs); one fresh env per job.
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      DATABASE_URL: postgresql://weather_user:weather_password@localhost:5432/weather_db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.13'
          enable-cache: true

      - name: Install API dependencies
        run: uv sync --project services/api

      - name: Ruff check (api)
        working-directory: services/api
        run: uv run ruff check .

      - name: MyPy (api)
        working-directory: services/api
        run: uv run mypy

      - name: Run API tests
        working-directory: services/api
        # Coverage floor enforced here only (not in pytest addopts) so partial
        # runs such as the cross-package contract suite are not spuriously failed.
        run: uv run pytest --junitxml=api-junit.xml --cov=api --cov-report=term-missing --cov-fail-under=50

      - name: Guard — no skipped tests (environment completeness invariant)
        # The job provisions PostgreSQL and Redis, so every skip-when-no-service
        # test has its condition satisfied. A skipped test here means the
        # environment is miswired and the suite green-washed — fail loudly.
        # Deliberately name-agnostic: tests may be renamed freely; the
        # invariant is about the environment, not specific test identities.
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("services/api/api-junit.xml").getroot()
          suites = root.findall("testsuite") or [root]
          totals = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          print("API suite:", totals)
          assert totals["tests"] > 0, "JUnit report contains no tests"
          assert totals["skipped"] == 0, "skipped tests in CI — integration environment incomplete"
          assert totals["failures"] == 0 and totals["errors"] == 0
          PY

      - name: Upload API test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: services/api/api-junit.xml
          retention-days: 7

  # ===========================================================================
  # 4. INGESTION PIPELINE (Ingestion, Sharding, Realtime & GC)
  # ===========================================================================
  ingestion-pipeline:
    name: Ingestion pipeline (PostgreSQL + Redis + MinIO)
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.root_python == 'true' ||
      needs.change-detection.outputs.ingestion == 'true' ||
      needs.change-detection.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: nickblah/postgis:18.6-trixie-postgis-3.6.4
        env:
          POSTGRES_USER: weather_user
          POSTGRES_PASSWORD: weather_password
          POSTGRES_DB: weather_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather_user -d weather_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      minio:
        # MinIO community images: quay.io/minio/* requires authentication and
        # the Docker Hub repos were removed; alpine/minio is the community
        # rebuild of official source releases. Runs as root (the image's /data
        # is root-owned) and ships busybox wget, not curl.
        image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minio_admin
          MINIO_ROOT_PASSWORD: minio_password
        ports:
          - 9000:9000
        options: >-
          --user 0:0
          --health-cmd "wget -qO- http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Pin uv's project environment (uv otherwise discovers/creates the
      # workspace-root .venv for member syncs); one fresh env per job.
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      DATABASE_URL: postgresql://weather_user:weather_password@localhost:5432/weather_db
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      MINIO_SECURE: 'false'
      MINIO_BUCKET_NAME: weather-data
      WEATHER_TEST_MINIO: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install ecCodes native system dependency
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.13'
          enable-cache: true

      - name: Install Ingestion dependencies
        run: uv sync --project services/ingestion

      - name: Ruff check (ingestion)
        working-directory: services/ingestion
        run: uv run ruff check .

      - name: MyPy (ingestion)
        working-directory: services/ingestion
        run: uv run mypy

      - name: Create MinIO bucket
        working-directory: services/ingestion
        run: |
          uv run python - <<'PY'
          import time, boto3
          for _ in range(30):
              try:
                  s3 = boto3.client(
                      "s3",
                      endpoint_url="http://localhost:9000",
                      aws_access_key_id="minio_admin",
                      aws_secret_access_key="minio_password",
                  )
                  s3.create_bucket(Bucket="weather-data")
                  print("MinIO bucket 'weather-data' ready")
                  break
              except Exception as exc:
                  time.sleep(2)
          else:
              raise SystemExit("MinIO bucket initialization timed out")
          PY

      - name: Run Ingestion tests (with JUnit report)
        working-directory: services/ingestion
        # Coverage floor enforced here only (not in pytest addopts) so partial
        # runs such as the cross-package contract suite are not spuriously failed.
        run: uv run pytest -W error::ResourceWarning --junitxml=ingestion-junit.xml --cov=ingestion --cov-report=term-missing --cov-fail-under=50

      - name: Guard — no skipped tests (environment completeness invariant)
        # The job provisions PostgreSQL, Redis and MinIO (WEATHER_TEST_MINIO=1),
        # so every skip-when-no-service test has its condition satisfied —
        # including the S3 round-trip, cross-process concurrency, and serving
        # contract e2e suites that motivated the former per-name checks.
        # Deliberately name-agnostic: tests may be renamed, parametrized or
        # regrouped freely; the invariant protects the environment, not names.
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("services/ingestion/ingestion-junit.xml").getroot()
          suites = root.findall("testsuite") or [root]
          totals = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          print("Ingestion suite:", totals)
          assert totals["tests"] > 0, "JUnit report contains no tests"
          assert totals["skipped"] == 0, "skipped tests in CI — integration environment incomplete"
          assert totals["failures"] == 0 and totals["errors"] == 0
          PY

      - name: Upload Ingestion test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-test-results
          path: services/ingestion/ingestion-junit.xml
          retention-days: 7

  # ===========================================================================
  # 5. FRONTEND PIPELINE (Unit, Lint, Typecheck, Build & Playwright E2E)
  # ===========================================================================
  frontend-unit-build:
    name: Frontend quality & unit build
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Run Jest unit tests
        run: npm run test -- --ci

      - name: Next.js standalone build
        run: npm run build

  frontend-e2e:
    name: Frontend E2E (Playwright)
    # E2E routes every /v1/** request through Playwright mocks, so API changes
    # cannot affect this suite — it triggers on frontend and CI changes only.
    needs: [change-detection, frontend-unit-build]
    if: |
      always() &&
      (needs.frontend-unit-build.result == 'success' || needs.frontend-unit-build.result == 'skipped') &&
      (
        github.event_name == 'push' ||
        needs.change-detection.outputs.ci == 'true' ||
        needs.change-detection.outputs.frontend == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('services/frontend/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Playwright (reporter: line) writes failure diagnostics — traces,
          # error contexts, screenshots — into its default test-results dir.
          path: services/frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # 6. CONTAINER BUILDS & RUNTIME SMOKE TESTS
  # ===========================================================================
  container-builds:
    name: Container builds & runtime smoke
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.docker == 'true' ||
      needs.change-detection.outputs.domain == 'true' ||
      needs.change-detection.outputs.api == 'true' ||
      needs.change-detection.outputs.ingestion == 'true' ||
      needs.change-detection.outputs.frontend == 'true' ||
      needs.change-detection.outputs.root_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # --- Validate Docker Compose Infrastructure Images ---
      - name: Validate Compose configuration and pull infrastructure images
        run: |
          docker compose config
          docker compose pull weather_postgres weather_redis weather_minio weather_minio_init

      - uses: docker/setup-buildx-action@v3

      # --- Build Images in Parallel via Buildx ---
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          target: runtime
          tags: weather-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Ingestion image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ingestion
          target: runtime
          tags: weather-ingestion:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          file: docker/Dockerfile.frontend
          target: runtime
          tags: weather-frontend:ci
          load: true
          build-args: |
            API_PROXY_TARGET=http://127.0.0.1:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Runtime Smoke Tests ---
      - name: Smoke test API (/docs & health)
        run: |
          docker run -d --name api-smoke -p 8000:8000 weather-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/docs >/dev/null 2>&1; then
              echo "API /docs OK"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/docs >/dev/null || { echo "API /docs FAILED"; docker logs api-smoke; exit 1; }
          docker rm -f api-smoke

      - name: Smoke test API Zarr-serving (xr.open_zarr)
        run: |
          docker run --rm \
            --entrypoint python \
            -e MINIO_ENDPOINT=localhost:9000 \
            -e MINIO_ACCESS_KEY=minio_admin \
            -e MINIO_SECRET_KEY=minio_password \
            -e MINIO_SECURE=false \
            weather-api:ci -c "import sys, tempfile, numpy as np, xarray as xr; store = tempfile.mkdtemp() + '/store.zarr'; ds = xr.Dataset({'temperature_2m': (('lead_time_hours','latitude','longitude'), np.zeros((1,2,2)))}, coords={'lead_time_hours':[6],'latitude':[38.0,39.0],'longitude':[-107.0,-106.0]}); ds.to_zarr(store, mode='w'); sys.path.insert(0, '/app/services/api/src'); from api.core.zarr import read_dataset; back = read_dataset(store); assert 'temperature_2m' in back.data_vars; print('API Zarr-serving OK; vars', list(back.data_vars))" || { echo "API Zarr-serving smoke FAILED"; exit 1; }

      - name: Smoke test Frontend (/)
        run: |
          docker run -d --name fe-smoke -p 3000:3000 weather-frontend:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "Frontend / OK"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/ >/dev/null || { echo "Frontend / FAILED"; docker logs fe-smoke; exit 1; }
          docker rm -f fe-smoke

      - name: Smoke test Ingestion (GRIB2 decode)
        run: |
          docker run --rm \
            --entrypoint python \
            -v "$PWD/services/ingestion/tests/fixtures/gfs.t00z.pgrb2.0p25.f006.grib2":/fixture.grib2 \
            weather-ingestion:ci -c "import sys; sys.path.insert(0, '/app/services/ingestion/src'); import xarray as xr; ds = xr.open_dataset('/fixture.grib2', engine='cfgrib'); assert 't2m' in ds.data_vars, 'cfgrib decode produced no t2m variable'; print('GRIB decode OK; t2m range', float(ds.t2m.min()), float(ds.t2m.max()))" || { echo "Ingestion GRIB decode FAILED"; exit 1; }

  # ===========================================================================
  # 7. ARM64 CONTAINER BUILDS & ARCHITECTURE GUARDRAILS
  # ===========================================================================
  arm64-builds:
    name: ARM64 container builds & smoke
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.docker == 'true' ||
      needs.change-detection.outputs.domain == 'true' ||
      needs.change-detection.outputs.api == 'true' ||
      needs.change-detection.outputs.ingestion == 'true' ||
      needs.change-detection.outputs.root_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Build Images for linux/arm64 ---
      - name: Build ARM64 API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/arm64
          target: runtime
          tags: weather-api:arm64-ci
          load: true
          cache-from: type=gha,scope=arm64-api
          cache-to: type=gha,mode=max,scope=arm64-api

      - name: Build ARM64 Ingestion image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ingestion
          platforms: linux/arm64
          target: runtime
          tags: weather-ingestion:arm64-ci
          load: true
          cache-from: type=gha,scope=arm64-ingestion
          cache-to: type=gha,mode=max,scope=arm64-ingestion

      # --- Architecture / Platform Metadata Validation ---
      - name: Validate built image architectures
        run: |
          API_ARCH=$(docker inspect weather-api:arm64-ci --format '{{.Architecture}}')
          INGEST_ARCH=$(docker inspect weather-ingestion:arm64-ci --format '{{.Architecture}}')
          echo "API image architecture: $API_ARCH"
          echo "Ingestion image architecture: $INGEST_ARCH"
          if [ "$API_ARCH" != "arm64" ]; then
            echo "ERROR: API image architecture is '$API_ARCH', expected 'arm64'"
            exit 1
          fi
          if [ "$INGEST_ARCH" != "arm64" ]; then
            echo "ERROR: Ingestion image architecture is '$INGEST_ARCH', expected 'arm64'"
            exit 1
          fi
          echo "Platform validation PASSED: all images are linux/arm64."

      # --- Minimal Container Startup & CLI Smoke Tests (ARM64 Emulation) ---
      - name: Smoke test ARM64 API imports & dependencies
        run: |
          docker run --rm \
            weather-api:arm64-ci \
            python -c "import numpy, pandas, psycopg2, zarr, numcodecs, api.main; print('API ARM64 import OK')"

      - name: Smoke test ARM64 Ingestion CLI & ecCodes/cfgrib
        run: |
          docker run --rm weather-ingestion:arm64-ci --help
          docker run --rm \
            --entrypoint python \
            weather-ingestion:arm64-ci \
            -c "import cfgrib; print('cfgrib/ecCodes ARM64 import OK')"

  # ===========================================================================
  # 8. DOCS & PACKAGE METADATA VALIDATION
  # ===========================================================================
  docs-metadata:
    name: Docs & package metadata
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.docs == 'true' ||
      needs.change-detection.outputs.root_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.13'
          enable-cache: true

      - name: Validate lockfile freshness (uv.lock must be up to date)
        run: uv lock --check

      - name: Validate workspace member buildability & metadata
        run: uv build --all-packages

      - name: Validate shared runtime dependency alignment
        run: python scripts/check_dependency_alignment.py

      - name: Sanity check placeholder packages
        run: |
          python -c "import sys; sys.path.insert(0, 'packages/contracts/src'); import contracts; assert contracts.__version__ == '0.1.0'"
          python -c "import sys; sys.path.insert(0, 'packages/config/src'); import config; assert config.__version__ == '0.1.0'"

  # ===========================================================================
  # 9. CROSS-PACKAGE CONTRACT COVERAGE
  # ===========================================================================
  cross-package-contracts:
    name: Cross-package contract gates
    needs: [change-detection]
    if: |
      github.event_name == 'push' ||
      needs.change-detection.outputs.ci == 'true' ||
      needs.change-detection.outputs.root_python == 'true' ||
      needs.change-detection.outputs.domain == 'true' ||
      needs.change-detection.outputs.api == 'true' ||
      needs.change-detection.outputs.ingestion == 'true' ||
      needs.change-detection.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # One shared workspace environment for all member packages: the root
      # project aggregates every workspace member from the single uv.lock.
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.13'
          enable-cache: true

      # One shared workspace environment: the root project aggregates every
      # workspace member plus their dependency trees from the single uv.lock.
      # Test steps below run with --no-sync so this environment is reused
      # as-is (per-package pytest config still applies via --directory).
      - name: Install Python workspace dependencies
        run: uv sync --all-packages

      - name: Install Frontend dependencies
        working-directory: services/frontend
        run: npm ci

      - name: Verify OpenAPI schema export
        run: uv run --directory services/api --no-sync pytest tests/test_openapi_export.py

      - name: Run Python cross-package contract tests
        run: uv run --directory services/ingestion --no-sync pytest ../../tests/contracts

      - name: Run Frontend OpenAPI contract suite
        working-directory: services/frontend
        run: npm test -- openapi_contract.test.ts

  # ===========================================================================
  # 10. STABLE MERGE GATE (ci-required)
  # ===========================================================================
  ci-required:
    name: ci-required (merge gate)
    needs:
      - change-detection
      - domain-pipeline
      - api-pipeline
      - ingestion-pipeline
      - frontend-unit-build
      - frontend-e2e
      - container-builds
      - arm64-builds
      - docs-metadata
      - cross-package-contracts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Single maintenance point for the merge gate: a job blocks the merge if
      # and only if it ended 'failure', was 'cancelled', or was blocked
      # ('action_required'). 'skipped' is the legitimate outcome of path
      # filtering and never blocks. Adding or
      # renaming a job only requires updating the needs list above and the
      # loop below — no second gating table to keep in sync.
      - name: Evaluate merge gate
        run: |
          set -u
          fail=0
          for entry in \
            "change-detection=${{ needs.change-detection.result }}" \
            "domain-pipeline=${{ needs.domain-pipeline.result }}" \
            "api-pipeline=${{ needs.api-pipeline.result }}" \
            "ingestion-pipeline=${{ needs.ingestion-pipeline.result }}" \
            "frontend-unit-build=${{ needs.frontend-unit-build.result }}" \
            "frontend-e2e=${{ needs.frontend-e2e.result }}" \
            "container-builds=${{ needs.container-builds.result }}" \
            "arm64-builds=${{ needs.arm64-builds.result }}" \
            "docs-metadata=${{ needs.docs-metadata.result }}" \
            "cross-package-contracts=${{ needs.cross-package-contracts.result }}"
          do
            job="${entry%%=*}"
            result="${entry#*=}"
            echo "${job}: ${result}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ] || [ "$result" = "action_required" ]; then
              echo "::error::CI gate '${job}' ended with status '${result}'"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Merge gate RED."
            exit 1
          fi
          echo "All CI gates green. Merge gate GREEN."
